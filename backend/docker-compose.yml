# Solo para desarrollo local. En AWS la base es el RDS.
# Las credenciales vienen del archivo .env (no versionado).
services:
  db:
    image: postgres:16
    container_name: clave-scheduling-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
