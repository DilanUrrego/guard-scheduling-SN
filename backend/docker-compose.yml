services:
  db:
    image: postgres:16
    container_name: clave-scheduling-db
    environment:
      POSTGRES_USER: clave_user
      POSTGRES_PASSWORD: clave_pass
      POSTGRES_DB: clave_scheduling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: